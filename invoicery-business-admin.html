<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-runtime>Invoicery Business — Superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ib-design.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);color:var(--text);background:var(--bg)}
.hidden{display:none!important}

/* ══ SIDEBAR ══ */
.sb{width:240px;flex-shrink:0;background:var(--darker);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;overflow-y:auto}
.sb-logo{padding:1.15rem 1.2rem 1rem;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:.6rem;text-decoration:none}
.sb-logo-mark{width:32px;height:32px;background:var(--orange);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.02em}
.sb-logo-wrap{display:flex;flex-direction:column;line-height:1.15}
.sb-logo-name{font-size:.88rem;font-weight:800;color:#fff}
.sb-logo-sub{font-size:.58rem;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.08em;text-transform:uppercase}
.sb-admin-pill{margin:.75rem 1.2rem;background:rgba(240,160,32,.15);border:1px solid rgba(240,160,32,.3);border-radius:4px;padding:.3rem .75rem;display:flex;align-items:center;gap:.45rem;font-size:.7rem;font-weight:700;color:var(--orange)}
.sb-section{padding:.75rem 1.2rem .2rem;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:rgba(255,255,255,.22)}
.sb-nav{list-style:none;padding:.25rem 0}
.sb-nav li button{display:flex;align-items:center;gap:.62rem;width:100%;padding:.58rem 1.2rem;font-size:.82rem;font-weight:600;color:rgba(255,255,255,.52);background:transparent;border:none;cursor:pointer;font-family:inherit;transition:background var(--dur-fast) ease,color var(--dur-fast) ease,border-color var(--dur-fast) ease,box-shadow var(--dur-fast) ease;text-align:left}
.sb-nav li button:hover{color:#fff;background:rgba(255,255,255,.06)}
.sb-nav li button.active{color:#fff;background:rgba(43,95,142,.5);border-right:3px solid var(--orange)}
.sb-ni{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.7}
.sb-nav li button.active .sb-ni,.sb-nav li button:hover .sb-ni{opacity:1}
.sb-ni svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.sb-badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:100px;font-size:.6rem;font-weight:800;padding:.06rem .42rem;min-width:16px;text-align:center;line-height:1.5}
.sb-badge-gn{background:var(--green)}
.sb-bot{margin-top:auto;padding:1rem;border-top:1px solid rgba(255,255,255,.07)}
.sb-user{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.sb-av{width:32px;height:32px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff;flex-shrink:0}
.sb-name{font-size:.8rem;font-weight:700;color:#fff;line-height:1.2}
.sb-role{font-size:.64rem;color:rgba(255,255,255,.38)}
.sb-bot .btn-gh{color:rgba(255,255,255,.72)!important;border-color:rgba(255,255,255,.18)!important}
.sb-bot .btn-gh:hover{color:#fff!important;border-color:rgba(255,255,255,.45)!important;background:rgba(255,255,255,.06)!important}

/* ══ MAIN ══ */
.app{display:flex;min-height:100vh}
.main{margin-left:240px;flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:.82rem 2rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.topbar-left{display:flex;align-items:center;gap:.75rem}
.tb-back{display:flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:600;color:var(--mid);text-decoration:none;padding:.3rem .6rem;border-radius:4px;transition:background var(--dur-fast) ease,color var(--dur-fast) ease,border-color var(--dur-fast) ease,box-shadow var(--dur-fast) ease}
.tb-back:hover{background:var(--bg);color:var(--navy)}
.tb-back svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tb-divider{width:1px;height:20px;background:var(--border)}
.tb-title{font-size:1rem;font-weight:800;color:var(--dark)}
.tb-sub{font-size:.73rem;color:var(--muted);margin-top:.03rem}
.tb-right{display:flex;align-items:center;gap:.75rem}
.tb-date{font-size:.76rem;color:var(--muted)}
.tb-alert{display:flex;align-items:center;gap:.35rem;background:var(--abg);border:1px solid var(--orange-30);color:var(--atxt);padding:.3rem .75rem;border-radius:4px;font-size:.75rem;font-weight:700;cursor:pointer}
.tb-alert svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.pg{padding:1.75rem 2rem;flex:1}

/* ══ BUTTONS ══ */
.btn{display:inline-flex;align-items:center;gap:.38rem;padding:.5rem 1.05rem;border-radius:5px;font-size:.82rem;font-weight:700;cursor:pointer;border:none;transition:background var(--dur-fast) ease,color var(--dur-fast) ease,border-color var(--dur-fast) ease,box-shadow var(--dur-fast) ease;font-family:inherit;text-decoration:none;white-space:nowrap}
.btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
.btn-or{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(240,160,32,.25)}
.btn-or:hover{background:var(--orange-d);transform:translateY(-1px)}
.btn-nv{background:var(--navy);color:#fff}
.btn-nv:hover{background:var(--dark)}
.btn-gh{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-gh:hover{border-color:var(--navy);color:var(--navy)}
.btn-ok{background:var(--green);color:#fff}
.btn-ok:hover{background:var(--green-70)}
.btn-dn{background:var(--red);color:#fff}
.btn-dn:hover{background:var(--red-80)}
.btn-am{background:var(--amber);color:#fff}
.btn-am:hover{background:var(--orange-80)}
.btn-sm{padding:.32rem .78rem;font-size:.74rem}
.btn-lg{padding:.75rem 1.8rem;font-size:.9rem}
.btn-fw{width:100%;justify-content:center}

/* ══ INPUTS ══ */


.inp::placeholder{color:var(--muted)}
textarea




/* ══ CARDS ══ */
.card{background:var(--card);border-radius:10px;border:1px solid var(--border);box-shadow:var(--sh)}
.card-hd{padding:1rem 1.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:1rem}
.card-bd{padding:1.35rem}
.card-title{font-size:.88rem;font-weight:700;color:var(--text)}
.card-sub{font-size:.72rem;color:var(--muted);margin-top:.1rem}

/* ══ STATS ══ */
.stats-g{display:grid;gap:1rem;margin-bottom:1.65rem}
.stats-g-4{grid-template-columns:repeat(4,1fr)}
.stats-g-3{grid-template-columns:repeat(3,1fr)}
.stat{background:#fff;border-radius:10px;border:1px solid var(--border);padding:1.15rem 1.3rem;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-bl::before{background:var(--navy)}
.stat-or::before{background:var(--orange)}
.stat-gn::before{background:var(--green)}
.stat-rd::before{background:var(--red)}
.stat-am::before{background:var(--amber)}
.stat-pu::before{background:var(--sky-60)}
.stat-ico{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:.65rem}
.stat-ico svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.ico-bl{background:rgba(43,95,142,.1);color:var(--navy)}
.ico-or{background:var(--orange-10);color:var(--orange)}
.ico-gn{background:var(--gbg);color:var(--green)}
.ico-rd{background:var(--rbg);color:var(--red)}
.ico-am{background:var(--abg);color:var(--amber)}
.ico-pu{background:var(--sky-20);color:var(--sky-60)}
.stat-lbl{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:.2rem}
.stat-val{font-size:1.9rem;font-weight:800;color:var(--dark);letter-spacing:-.04em;line-height:1}
.stat-d{font-size:.7rem;color:var(--muted);margin-top:.25rem;display:flex;align-items:center;gap:.3rem}
.stat-d.up{color:var(--green)}
.stat-d svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}

/* ══ TABLE ══ */



.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--primary-10)}
.tbl-wrap{overflow-x:auto}

/* ══ BADGES ══ */
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.17rem .6rem;border-radius:100px;font-size:.67rem;font-weight:700;white-space:nowrap}
.badge svg{width:10px;height:10px;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.b-am{background:var(--abg);color:var(--atxt)}
.b-gn{background:var(--gbg);color:var(--gtxt)}
.b-rd{background:var(--rbg);color:var(--rtxt)}
.b-bl{background:var(--bluebg);color:var(--bluetxt)}
.b-gr{background:var(--primary-20);color:var(--mid)}
.b-pu{background:var(--sky-20);color:var(--sky-80)}
.b-or{background:var(--orange-10);color:var(--orange-80)}

/* ══ MISC ══ */
.empty{text-align:center;padding:3.5rem 1rem;color:var(--muted)}
.empty-ico{margin-bottom:.85rem;opacity:.4}
.empty-ico svg{width:48px;height:48px;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.empty h3{font-size:.95rem;font-weight:700;color:var(--mid);margin-bottom:.35rem}
.empty p{font-size:.83rem}
.alert{padding:.75rem 1rem;border-radius:6px;font-size:.83rem;font-weight:600;margin-bottom:1rem;display:flex;align-items:flex-start;gap:.55rem}
.alert svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;margin-top:.05rem}
.alert-ok{background:var(--gbg);color:var(--gtxt);border:1px solid var(--green-30)}
.alert-am{background:var(--abg);color:var(--atxt);border:1px solid var(--orange-30)}
.alert-rd{background:var(--rbg);color:var(--rtxt);border:1px solid var(--red-30)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.fg-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.85rem}
.fc{grid-column:1/-1}
/* Search bar */
.search-bar{display:flex;align-items:center;gap:.6rem;background:#fff;border:1.5px solid var(--border);border-radius:6px;padding:.42rem .75rem;transition:border-color .2s;max-width:320px}
.search-bar:focus-within{border-color:var(--navy)}
.search-bar svg{width:15px;height:15px;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
.search-bar input{border:none;outline:none;font-size:.84rem;font-family:inherit;color:var(--text);background:transparent;width:100%}
.search-bar input::placeholder{color:var(--muted)}
/* Activity feed */
.activity{display:flex;flex-direction:column;gap:.65rem}
.activity-item{display:flex;align-items:flex-start;gap:.75rem;padding:.65rem;border-radius:7px;background:var(--bg)}
.act-ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-ico svg{width:14px;height:14px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.act-text{flex:1;min-width:0}
.act-title{font-size:.82rem;font-weight:700;color:var(--text)}
.act-sub{font-size:.74rem;color:var(--mid);margin-top:.08rem}
.act-time{font-size:.7rem;color:var(--muted);flex-shrink:0;padding-top:.1rem}
/* Tab nav */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
.tab{padding:.6rem 1.2rem;font-size:.83rem;font-weight:700;color:var(--muted);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-2px;transition:background var(--dur-fast) ease,color var(--dur-fast) ease,border-color var(--dur-fast) ease,box-shadow var(--dur-fast) ease}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}
/* Payroll card */
.proll-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--border)}
.proll-row:last-child{border-bottom:none}
.proll-info{display:flex;flex-direction:column;gap:.15rem}
.proll-name{font-size:.85rem;font-weight:700;color:var(--text)}
.proll-meta{font-size:.74rem;color:var(--mid)}
.proll-amounts{display:flex;align-items:center;gap:1.5rem}
.proll-amt{text-align:right}
.proll-amt-lbl{font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.proll-amt-val{font-size:.92rem;font-weight:800;color:var(--dark)}
/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.5rem;backdrop-filter:blur(3px)}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:0 24px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-hd{background:var(--dark);padding:1.3rem 1.6rem;display:flex;align-items:center;justify-content:space-between}
.modal-hd-title{font-size:.95rem;font-weight:800;color:#fff}
.modal-close{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:1.3rem;line-height:1;transition:color .15s}
.modal-close:hover{color:#fff}
.modal-bd{padding:1.5rem}
/* Progress bar */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:.5rem}
.progress-fill{height:100%;border-radius:3px;background:var(--orange);transition:width .4s ease}

@media(max-width:900px){
  .sb{transform:translateX(-100%);transition:transform .3s}
  .sb.open{transform:translateX(0)}
  .main{margin-left:0}
  .stats-g-4{grid-template-columns:1fr 1fr}
}

/* market switcher */
.mkt-switch{display:flex;gap:.25rem;background:rgba(255,255,255,.07);padding:.25rem;border-radius:7px}
.mkt-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:.35rem;background:none;border:none;cursor:pointer;font-family:inherit;padding:.4rem .5rem;border-radius:5px;font-size:.78rem;font-weight:700;color:rgba(255,255,255,.6);transition:background .18s,color .18s}
.mkt-btn:hover{color:#fff;background:rgba(255,255,255,.08)}
.mkt-btn.active{background:var(--orange);color:#fff}
.mkt-flag{font-size:1rem;line-height:1}
.alert-warn{background:var(--abg);color:var(--atxt);border:1px solid var(--orange-30)}

/* ── excel import ── */
.drop{border:2px dashed var(--border);border-radius:10px;padding:2.2rem 1.5rem;text-align:center;cursor:pointer;transition:border-color .2s,background .2s;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--orange);background:var(--orange-10)}
.drop-ico{color:var(--navy);margin-bottom:.6rem}
.drop-main{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:.25rem}
.drop-sub{font-size:.78rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:.25rem .7rem;font-size:.78rem;color:var(--mid)}
.chip strong{color:var(--text)}
.chip-gn{background:var(--gbg);border-color:var(--green-30);color:var(--gtxt)}
.chip-am{background:var(--abg);border-color:var(--orange-30);color:var(--atxt)}
.chip-rd{background:var(--rbg);border-color:var(--red-30);color:var(--rtxt)}
tr.row-err{background:rgba(220,38,38,.045)}
tr.row-warn{background:rgba(217,119,6,.045)}
.alert-err{background:var(--rbg);color:var(--rtxt);border:1px solid var(--red-30)}

/* ═══════════════════ MOTION & INTERACTION SYSTEM ═══════════════════ */
.btn,.sb-nav button,.mkt-btn,.tb-back,.tb-alert{
  transition:transform var(--dur-press) var(--ease-out),
             background var(--dur-fast) ease,
             color var(--dur-fast) ease,
             border-color var(--dur-fast) ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active,.mkt-btn:active{transform:scale(.97)}
.sb-nav button:active,.tb-back:active,.tb-alert:active{transform:scale(.985)}

:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:3px}
.sb :focus-visible{outline-color:var(--orange)}
.inp:focus-visible{outline:none}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(43,95,142,.14)}

.pg{animation:pg-in var(--dur-fast) var(--ease-out) both}
@keyframes pg-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.modal-ov{animation:ov-in var(--dur-modal) var(--ease-out) both}
.modal{animation:modal-in var(--dur-modal) var(--ease-out) both}
@keyframes ov-in{from{opacity:0}to{opacity:1}}
@keyframes modal-in{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}

.drop{transition:border-color var(--dur-fast) ease,background var(--dur-fast) ease,
                 transform var(--dur-press) var(--ease-out)}
.drop:active{transform:scale(.995)}

@media (hover:hover) and (pointer:fine){
  .proll-row:hover{background:var(--bg)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important;
  }
  .pg,.modal,.modal-ov{animation:none;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="app">

<!-- ══ SIDEBAR ══ -->
<aside class="sb">
  <a class="sb-logo" href="invoicery-business.html">
    <div class="sb-logo-mark">IB</div>
    <div class="sb-logo-wrap">
      <div class="sb-logo-name">Invoicery Business</div>
      <div class="sb-logo-sub" id="sb-market">—</div>
    </div>
  </a>
  <div class="sb-admin-pill">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span data-i18n="a.superadmin">Superadmin-adgang</span>
  </div>
  <div id="market-switch" style="padding:0 1rem 1rem"></div>

  <div class="sb-section" data-i18n="nav.a.dash">Oversigt</div>
  <ul class="sb-nav">
    <li><button onclick="go('a-dash')" data-v="a-dash">
      <span class="sb-ni"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
      <span data-i18n="nav.a.dash">Oversigt</span>
    </button></li>
    <li><button onclick="go('a-activity')" data-v="a-activity">
      <span class="sb-ni"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
      <span data-i18n="nav.a.activity">Aktivitet</span>
    </button></li>
  </ul>

  <div class="sb-section" data-i18n="sb.assignments">Opgavestyring</div>
  <ul class="sb-nav">
    <li><button onclick="go('a-approve')" data-v="a-approve">
      <span class="sb-ni"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
      <span data-i18n="nav.a.approve">Godkendelser</span>
      <span class="sb-badge" id="adm-badge-approve">0</span>
    </button></li>
    <li><button onclick="go('a-all')" data-v="a-all">
      <span class="sb-ni"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
      <span data-i18n="nav.a.all">Alle opgaver</span>

/* ═══════════════════ INVOICE REVIEW ═══════════════════

   The chain is: consultant submits -> WE review -> the client company
   approves, but only if that company asked to. A company that has opted out
   never sees the invoice; approving here issues it and sends it.

   Before this, aApprove() and the portal's bApprove() both filtered on
   STATUS.PENDING, so one assignment sat in two queues at once and whoever
   clicked first won. The admin step now owns PENDING and hands over to
   STATUS.CUSTOMER, which is the only thing the company list reads.

   This view shows salary and bank details. That is correct HERE and wrong
   on the company side — bOrder() in the portal must never render them, and
   render-smoke.cjs asserts it does not. */

let CURRENT_INVOICE=null;

window.openInvoice=function(id){CURRENT_INVOICE=id;go('a-invoice')};

function aApprove(){
  const list=getAssignments().filter(a=>a.status===STATUS.PENDING);
  if(!list.length) return `<div class="card"><div class="card-bd">
    <div class="alert alert-ok">${ICO.check}<span>${esc(t('inv.queue.empty'))}</span></div></div></div>`;
  return `<div class="card">
    <div class="card-hd"><div><div class="card-title">${esc(t('title.a.approve'))}</div>
      <div class="card-sub">${list.length}</div></div></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>${esc(t('lbl.assignment'))}</th><th>${esc(t('lbl.consultant'))}</th>
        <th>${esc(t('inv.customer'))}</th><th>${esc(t('lbl.period'))}</th>
        <th class="num">${esc(t('lbl.hours'))}</th>
        <th class="num">${esc(t('line.invoiceTotal'))}</th>
        <th>${esc(t('co.approval'))}</th><th></th></tr></thead>
      <tbody>${list.map(a=>{
        const p=calcPayroll(a.amount,{hours:a.hours});
        const needs=requiresInvoiceApproval(a.companyId);
        return `<tr style="cursor:pointer" onclick="openInvoice('${esc(a.id)}')">
          <td><div style="font-weight:700">${esc(a.id)}</div>
            <div style="font-size:.72rem;color:var(--muted)">${esc(a.type)}</div></td>
          <td>${esc(a.consultantName)}</td>
          <td>${esc(a.companyName)}</td>
          <td>${esc(a.period)}</td>
          <td class="num">${a.hours}</td>
          <td class="num" style="font-weight:800">${fmtN(p.invoiceTotal)}</td>
          <td><span class="badge ${needs?'b-am':'b-gr'}">${esc(t(needs?'co.approvalOn':'co.approvalOff'))}</span></td>
          <td class="num"><button class="btn btn-or btn-sm"
            onclick="event.stopPropagation();openInvoice('${esc(a.id)}')">
            ${esc(t('act.review'))}</button></td></tr>`;
      }).join('')}</tbody></table></div></div>`;
}

function currentInvoice(){
  return getAssignments().find(a=>a.id===CURRENT_INVOICE)||null;
}

function invRow(label,value){
  return `<div style="display:flex;justify-content:space-between;gap:1rem;padding:.3rem 0;font-size:.82rem">
    <span style="color:var(--mid)">${esc(label)}</span>

}

function aInvoice(){
  const a=currentInvoice();
  if(!a) return `<div class="card"><div class="card-bd">
    <div class="alert alert-am"><span>${esc(t('order.missing.h'))}</span></div>
    <button class="btn btn-gh" onclick="go('a-approve')">${esc(t('order.back'))}</button>
    </div></div>`;

  const m=currentMarket();
  const co=companyById(a.companyId)||{};
  const con=getUsers().find(u=>u.id===a.consultantId)||{};
  const p=calcPayroll(a.amount,{hours:a.hours});
  const needs=requiresInvoiceApproval(a.companyId);
  const lines=a.lines&&a.lines.length?a.lines
    :[{description:a.description,hours:a.hours,hourlyRate:a.hourlyRate,amount:a.amount}];
  const terms=co.paymentTerms||30;

  const banner=a.status===STATUS.PENDING
    ?`<div class="alert ${needs?'alert-am':'alert-ok'}" style="margin-bottom:1rem">
        <span>${esc(t(needs?'inv.needsCustomer':'inv.autoSent'))}</span></div>`
    :a.status===STATUS.CUSTOMER
    ?`<div class="alert alert-am" style="margin-bottom:1rem">
        <span>${esc(t('inv.withCustomer'))}</span></div>`:'';

  return `<button class="btn btn-gh btn-sm" style="margin-bottom:1rem"
      onclick="go('a-approve')">${esc(t('order.back'))}</button>
    ${banner}
    <div class="card">
      <div class="card-hd">

/* Approving is where the per-customer preference is applied. A company that
   opted out never sees the invoice: we issue it and send it in the same
   step. One that opted in gets STATUS.CUSTOMER and the number is withheld
   until they approve, because an invoice number should belong to an invoice
   that is actually going out. */
function adminName(){
  const admin=getUsers().find(u=>u.role==='admin');
  return admin?admin.name:'';
}
function recordEvent(a,action,note){
  a.history=a.history||[];
  a.history.push({at:today(),by:adminName(),action:action,note:note||''});
}

window.adminApprove=function(id){
  const list=getAssignments(); const a=list.find(x=>x.id===id);
  if(a&&a.status===STATUS.PENDING){
    a.approvedDate=today();
    recordEvent(a,'approved','');
    if(requiresInvoiceApproval(a.companyId)){
      a.status=STATUS.CUSTOMER;
      recordEvent(a,'sentToCustomer','');
    }else{
      issueInvoice(a,list);
    }
  }
  saveAssignments(list); updBadges();
  go(a&&a.status===STATUS.CUSTOMER?'a-invoice':'a-approve');
}

/* Issuing stamps the number, the date and the due date derived from the
   customer's own payment terms. Kept in one place so the admin path and the
   customer-approval path in the portal cannot drift apart. */
function issueInvoice(a,list){
  a.status=STATUS.APPROVED;
  a.invoiceNumber=nextInvoiceNumber(list);
  a.invoiceDate=today();
  const co=companyById(a.companyId);
  a.dueDate=addDays(a.invoiceDate,(co&&co.paymentTerms)||30);
  recordEvent(a,'invoiceIssued','');
}

/* Rejecting or asking for a change requires a reason, and it is captured in
   the page rather than in a native prompt(): those block the browser
   automation the project is tested with, and the consultant needs the text
   anyway — a bare "rejected" tells them nothing they can act on. */
window.adminPrompt=function(id,action){
  const host=document.getElementById('inv-actions');
  if(!host) return;
  const rejecting=action==='rejected';
  host.innerHTML=`
    <div style="width:100%;max-width:520px">
      <div style="font-weight:700;margin-bottom:.2rem">
        ${esc(t(rejecting?'order.reject.title':'order.change.title'))}</div>
      <p style="font-size:.78rem;color:var(--muted);margin-bottom:.6rem">
        ${esc(t(rejecting?'order.reject.help':'order.change.help'))}</p>
      <div class="ig" id="inv-reason-field">
        <label class="lbl">${esc(t('order.reason'))}</label>
        <textarea class="inp" id="inv-reason" rows="3" oninput="clearInvReasonError()"
                  placeholder="${esc(t('order.reason.ph'))}"></textarea></div>
      <div class="ds-field-msg" id="inv-reason-err" style="display:none">
        ${esc(t('order.reason.required'))}</div>
      <div style="display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.7rem">
        <button class="btn ${rejecting?'btn-dn':'btn-or'}"
          onclick="adminCommit('${esc(id)}','${esc(action)}')">
          ${esc(t(rejecting?'act.reject':'act.requestChange'))}</button>
        <button class="btn btn-gh" onclick="go('a-invoice')">${esc(t('act.cancel'))}</button>
      </div></div>`;
  const ta=document.getElementById('inv-reason');
  if(ta) ta.focus();
}

window.clearInvReasonError=function(){
  const err=document.getElementById('inv-reason-err');
  const field=document.getElementById('inv-reason-field');
  if(err) err.style.display='none';
  if(field) field.removeAttribute('data-error');
}

window.adminCommit=function(id,action){
  const reason=(document.getElementById('inv-reason')||{}).value||'';
  if(!reason.trim()){
    const err=document.getElementById('inv-reason-err');
    const field=document.getElementById('inv-reason-field');
    if(err) err.style.display='block';
    if(field) field.setAttribute('data-error','');
    return;
  }
  const list=getAssignments(); const a=list.find(x=>x.id===id);
  if(!a||a.status!==STATUS.PENDING) return;
  a.status=action==='rejected'?STATUS.REJECTED:STATUS.DRAFT;
  recordEvent(a,action,reason.trim());
  saveAssignments(list); updBadges(); go('a-approve');
}

   profiles at its end.

   This is not the payroll-basis import (a-import). That one imports hours
   and rates for people who already exist; this one imports the people.

   IBStaff.validate() is pure — nothing is written until commitStaff(). Error
   rows are skipped on commit, never coerced, and re-uploading the same file
   flags every row as a duplicate rather than doubling the register. */

let STAFF_STATE=null;   // { fileName, table, mapping, validated } between steps
let STAFF_MSG='';

function staffFieldLabel(key){
  /* What a national identity number is called belongs to the jurisdiction,
     not to the reader's language — same reasoning as regLabel. */
  if(key==='personalId') return currentMarket().entity.personIdLabel;
  const reuse={email:'lbl.email',city:'lbl.city',street:'lbl.address'}[key];
  return t(reuse||('staff.f.'+key));
}

function staffProblems(r){
  const parts=r.errors.map(e=>staffFieldLabel(e.field)+' '+t('staff.e.'+e.code));
  if(!parts.length&&r.warnings.length)
    return r.warnings.map(w=>staffFieldLabel(w.field)).join(', ');
  return parts.join(', ');
}

window.onStaffFile=async function(file){
  if(!file) return;
  STAFF_MSG='';
  try{
    const table=await IBXlsx.readTable(file);
    if(table.rows.length>IBStaff.LIMITS.maxRows){
      STAFF_MSG=t('staff.tooManyRows'); STAFF_STATE=null; go('a-staff'); return;
    }
    const m=IBStaff.mapColumns(table.headers);
    STAFF_STATE={fileName:file.name,table,mapping:m.mapping,
                 missing:m.missing,unknown:m.unknown,
                 validated:IBStaff.validate(table,m.mapping,{existing:IB.getStaff()})};
  }catch(e){
    STAFF_STATE=null;
    STAFF_MSG=t('staff.badFile');
  }
  go('a-staff');
}

window.commitStaff=function(){
  if(!STAFF_STATE) return;
  const added=IBStaff.commit(STAFF_STATE.validated,{now:today()});
  IB.saveStaff(IB.getStaff().concat(added));
  STAFF_STATE=null; STAFF_MSG='';
  go('a-staff');
}

window.cancelStaff=function(){ STAFF_STATE=null; STAFF_MSG=''; go('a-staff'); }

window.clearStaff=function(){ IB.saveStaff([]); STAFF_MSG=''; go('a-staff'); }

window.downloadDatalon=function(){
  const csv=IBStaff.toDatalonCSV(IB.getStaff(),{market:IB.marketCode(),now:today()});

  download('datalon-'+IB.marketCode().toLowerCase()+'-'+today()+'.csv',csv,'text/csv');

function aImport(){return importView()}
const IMPORT_SCOPE='admin';
/* ═══════════════════ EXCEL IMPORT (shared by both apps) ═══════════════════
   Upload → parse → validate → preview → commit. Nothing is written until the
   user confirms, and error rows are skipped rather than coerced.

   `IMPORT_SCOPE` is set per app: 'company' in the portal, 'admin' in the
   back-office. The scope decides whether the file must name a company. */

let IMPORT_STATE = null;   // { fileName, table, validated } between steps

const ICO_CHECK_STEP='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

/* Which of the three steps the flow is on. Drives the stepper only; the
   underlying state is still IMPORT_STATE. */
let IMPORT_STEP = 1;

function stepState(n){
  return n < IMPORT_STEP ? 'done' : (n === IMPORT_STEP ? 'active' : 'todo');
}

function stepEl(n, titleKey, body){
  return `<div class="ds-step" data-state="${stepState(n)}">
    <div class="ds-step-num">${n}</div>
    <div class="ds-step-head">
      <span class="ds-step-title">${esc(t(titleKey))}</span>
      <span class="ds-step-check">${ICO_CHECK_STEP}</span>
    </div>
    <div class="ds-step-body">${body}</div>
  </div>`;
}

function importView(){
  const scope=IMPORT_SCOPE;
  const titleKey=scope==='admin'?'nav.a.import':'nav.b.import';
  IMPORT_STEP=1; IMPORT_STATE=null;
  return `
  <div class="card" style="max-width:940px">
    <div class="card-hd">
      <div><span class="card-title">${esc(t(titleKey))}</span></div>
      <button class="btn btn-gh btn-sm" onclick="downloadTemplate()">
        ${ICO_DL} ${esc(t('import.template'))}</button>
    </div>
    <div class="card-bd">
      <div class="ds-stepper" id="import-stepper">${importSteps()}</div>
    </div>
  </div>`;
}

function importSteps(){
  const choose = `
    <p style="font-size:var(--body-3);color:var(--text-muted);margin-bottom:var(--sp-16)">
      ${esc(t('import.templateHelp'))}</p>
    <div class="drop" id="drop"
         onclick="document.getElementById('file-input').click()"
         ondragover="event.preventDefault();this.classList.add('over')"
         ondragleave="this.classList.remove('over')"
         ondrop="handleDrop(event)">
      <div class="drop-ico">${ICO_UP}</div>
      <div class="drop-main">${esc(t('import.drop'))}</div>
      <div class="drop-sub">${esc(t('import.formats'))}</div>
    </div>
    <input type="file" id="file-input" accept=".xlsx,.csv,.tsv,.txt" style="display:none"
           onchange="handleFile(this.files[0])">`;

  return stepEl(1,'import.step.choose',choose)
       + stepEl(2,'import.step.review','<div id="import-out"></div>')
       + stepEl(3,'import.step.confirm','<div id="import-done"></div>');
}

/* Re-render the stepper in place, preserving whatever the later steps have
   already put into their slots. */
function renderSteps(keep){
  const host=document.getElementById('import-stepper');
  if(!host) return;
  const out=keep&&document.getElementById('import-out');
  const done=keep&&document.getElementById('import-done');
  const outHtml=out?out.innerHTML:'';
  const doneHtml=done?done.innerHTML:'';
  host.innerHTML=importSteps();
  if(outHtml){const e=document.getElementById('import-out'); if(e) e.innerHTML=outHtml;}
  if(doneHtml){const e=document.getElementById('import-done'); if(e) e.innerHTML=doneHtml;}
}

window.handleDrop=function(e){
  e.preventDefault();
  const el=document.getElementById('drop');
  if(el) el.classList.remove('over');
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f) handleFile(f);
}

window.handleFile=async function(file){
  if(!file) return;
  IMPORT_STEP=2;
  renderSteps(false);
  const out=document.getElementById('import-out');
  out.innerHTML=`<div style="color:var(--text-muted);font-size:var(--body-3)">${esc(t('import.reading'))}</div>`;
  let table;
  try{
    table=await IBXlsx.readTable(file);
  }catch(err){
    const known=['EMPTY_FILE','NOT_A_WORKBOOK','LEGACY_XLS','NO_SHEETS'];
    const key=known.indexOf(err.message)!==-1?err.message:'UNSUPPORTED';
    out.innerHTML=importError(t('import.err.'+key));
    return;
  }

  const ctx={
    scope:IMPORT_SCOPE,
    users:getUsers(),
    existing:getAssignments(),
    company:IMPORT_SCOPE==='company'?ME:null
  };
  const validated=IBImport.validate(table,ctx);
  IMPORT_STATE={fileName:file.name,table,validated};

  if(validated.fatal){
    const detail=validated.fatal==='MISSING_COLUMNS'
      ? validated.missing.map(f=>t('import.col.'+f)).join(', ')
      : (validated.fatalDetail||'');
    out.innerHTML=importError(t('import.err.'+validated.fatal),detail);
    return;
  }
  IMPORT_STEP=2;
  renderSteps(false);
  document.getElementById('import-out').innerHTML=previewHTML(validated,file.name);
}

  return `<div class="alert alert-err">

  <div style="display:flex;gap:.7rem;margin-top:1.1rem;align-items:center;flex-wrap:wrap">
    ${creatable
      ? `<button class="btn btn-or" onclick="commitImport()">${esc(t('import.willCreate').replace('{n}',creatable))}</button>`
      : `<button class="btn btn-gh" disabled>${esc(t('import.willCreateNone'))}</button>`}
    ${s.error?`<span style="font-size:.8rem;color:var(--mid)">${esc(t('import.skipped').replace('{n}',s.error))}</span>`:''}
  </div>`;
}

window.commitImport=function(){
  if(!IMPORT_STATE||!IMPORT_STATE.validated) return;
  const res=IBImport.commit(IMPORT_STATE.validated,{});
  IMPORT_STEP=3;
  renderSteps(true);
  const out=document.getElementById('import-done');
  out.innerHTML=`
  <div class="alert alert-ok">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    <span><strong>${esc(t('import.committed'))}</strong> — ${esc(
      t('import.committedBody').replace('{n}',res.created.length).replace('{b}',res.batchId))}</span>
  </div>
  <div style="display:flex;gap:.7rem;margin-top:1rem">
    <button class="btn btn-or" onclick="${IMPORT_SCOPE==='admin'?"go('a-all')":"go('b-all')"}">${esc(t('import.viewCreated'))}</button>
    <button class="btn btn-gh" onclick="${IMPORT_SCOPE==='admin'?"go('a-import')":"go('b-import')"}">${esc(t('import.again'))}</button>
  </div>`;
  IMPORT_STATE=null;
  if(typeof updBadges==='function') updBadges();
}

/* Client-side download. No server round trip, so it works from file:// too. */
function download(filename,text,mime){
  const blob=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

window.downloadTemplate=function(){
  const m=currentMarket();
  const csv=IBImport.templateCSV(IMPORT_SCOPE,m.lang);
  download('loengrundlag-'+m.code.toLowerCase()+'.csv',csv,'text/csv');
}

window.downloadJeeves=function(kind){
  const m=currentMarket();
  const paid=getAssignments().filter(a=>a.status===STATUS.PAID);
  if(!paid.length) return;
  const stamp=IB.today().replace(/-/g,'');
  if(kind==='json'){
    download('jeeves-'+m.code.toLowerCase()+'-'+stamp+'.json',
             JSON.stringify(IBImport.toJeeves(paid,m),null,2),'application/json');
  }else{
    download('jeeves-'+m.code.toLowerCase()+'-'+stamp+'.csv',
             IBImport.toJeevesCSV(paid,m),'text/csv');
  }
}

window.pushJeeves=async function(){
  const m=currentMarket();
  const paid=getAssignments().filter(a=>a.status===STATUS.PAID);
  const res=await IBImport.sendToJeeves(paid,m);
  const out=document.getElementById('jeeves-out');
  if(!out) return;
  const msg=res.reason==='NO_ENDPOINT'?t('jeeves.noEndpoint')
          : res.reason==='MAPPING_UNVERIFIED'?t('jeeves.unverified')
          : res.reason==='EMPTY'?t('jeeves.nothing')
          : t('jeeves.noEndpoint');
  out.innerHTML=`<div class="alert alert-warn">
    <svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span>${esc(msg)}</span></div>`;
}
